<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROBAT 烘豆溫度曲線觀測器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
/*
 * led-core.js — 七段 LED 判讀核心（純 JavaScript，零相依）
 *
 * 與 led_temp.py 同一套演算法，逐項對應移植：
 *   1. 自動找出畫面上的顯示器（橫向投影切列帶 -> 連通元件濾掉圓點 -> 縱向切開並排的顯示器）
 *   2. 在顯示器旁自動挑一塊面板當追蹤模板（要求比對峰值高且唯一）
 *   3. 用金字塔式模板比對追蹤位移，把 ROI 對齊到參考座標
 *   4. ★ 對齊後多格取最大值合成 —— 補滿 LED 掃描造成的缺筆劃
 *      （沒對齊就疊加會糊掉，先對齊再疊加才成立）
 *   5. 自動量測傾斜量並扶正（不扶正的話右下段 c 幾乎讀不到）
 *   6. 暴力搜尋字距與相位，目標函數 =「能解出多少合法數字」+ 取樣餘裕
 *
 * 瀏覽器與 Node 都可用。瀏覽器端傳入的就是 canvas 的 ImageData.data。
 */
(function (root) {
  'use strict';

  var LIT = 60;        // 合成影像上判定發光的門檻
  var RED_MIN = 85;    // 紅色通道下限，濾掉暗紅反光（手機預覽偏暗，放寬）

  // 每一段在字框內的相對位置 [名稱, x0, x1, y0, y1]
  var SEGBOX = [
    ['a', 0.28, 0.72, 0.02, 0.16], ['b', 0.74, 1.00, 0.15, 0.45],
    ['c', 0.74, 1.00, 0.55, 0.85], ['d', 0.28, 0.72, 0.84, 0.98],
    ['e', 0.00, 0.26, 0.55, 0.85], ['f', 0.00, 0.26, 0.15, 0.45],
    ['g', 0.28, 0.72, 0.43, 0.57]
  ];
  var TABLE = {
    abcdef: '0', bc: '1', abdeg: '2', abcdg: '3', bcfg: '4',
    acdfg: '5', acdefg: '6', abc: '7', abcdefg: '8', abcdfg: '9'
  };

  // ------------------------------------------------------------ 基本影像運算

  /**
   * 紅色發光強度：紅通道超出綠、藍的量，並依當幀亮度正規化。
   *
   * 正規化是關鍵：手機即時預覽的曝光會一直變（LED 掃描變暗時整幀跟著暗），
   * 寫死門檻在錄好的影片上沒問題，在相機上會忽亮忽暗導致辨識率掉。
   * 取 99.5 百分位當「這一幀最亮的紅」拉到固定值，下游所有固定門檻
   * 就等效於「相對亮度門檻」。太暗的一幀直接視為全暗，避免把雜訊放大成訊號。
   */
  function redness(rgba, w, h, redMin) {
    redMin = redMin === undefined ? RED_MIN : redMin;
    var n = w * h, out = new Uint8Array(n), hist = new Int32Array(256), i;
    for (i = 0; i < n; i++) {
      var r = rgba[i * 4], g = rgba[i * 4 + 1], b = rgba[i * 4 + 2];
      if (r <= redMin) { hist[0]++; continue; }
      var v = Math.min(r - g, r - b);
      v = v < 0 ? 0 : (v > 255 ? 255 : v);
      out[i] = v; hist[v]++;
    }
    var target = n * 0.005, acc = 0, p995 = 0;
    for (var k = 255; k >= 0; k--) { acc += hist[k]; if (acc >= target) { p995 = k; break; } }
    if (p995 < 40) return new Uint8Array(n);      // 這一幀沒有夠亮的紅色
    var gain = Math.min(200 / p995, 4);
    if (Math.abs(gain - 1) > 0.02)
      for (i = 0; i < n; i++) { var t = out[i] * gain; out[i] = t > 255 ? 255 : t; }
    return out;
  }

  function grayscale(rgba, w, h) {
    var out = new Uint8Array(w * h);
    for (var i = 0, n = w * h; i < n; i++)
      out[i] = (rgba[i * 4] * 77 + rgba[i * 4 + 1] * 150 + rgba[i * 4 + 2] * 29) >> 8;
    return out;
  }

  /** 逐格取最大值：補滿 LED 掃描造成的缺筆劃 */
  function maxComposite(masks) {
    var out = new Uint8Array(masks[0].length);
    for (var k = 0; k < masks.length; k++) {
      var m = masks[k];
      for (var i = 0; i < out.length; i++) if (m[i] > out[i]) out[i] = m[i];
    }
    return out;
  }

  /** 扶正斜體：dst(u,v) = src(u + s*v - s*h/2, v) */
  function deskew(mask, w, h, s) {
    if (!s) return mask;
    var out = new Uint8Array(w * h), t = s * h / 2;
    for (var v = 0; v < h; v++) {
      var fx = s * v - t, row = v * w;
      var x0 = Math.floor(fx), fr = fx - x0;
      for (var u = 0; u < w; u++) {
        var a = u + x0, b = a + 1;
        var va = (a >= 0 && a < w) ? mask[row + a] : 0;
        var vb = (b >= 0 && b < w) ? mask[row + b] : 0;
        out[row + u] = (va + (vb - va) * fr) | 0;
      }
    }
    return out;
  }

  /** 二值化後的積分圖，讓每個取樣框都能 O(1) 求平均 */
  function integral(mask, w, h) {
    var ii = new Int32Array((w + 1) * (h + 1));
    for (var y = 0; y < h; y++) {
      var run = 0;
      for (var x = 0; x < w; x++) {
        run += mask[y * w + x] > LIT ? 1 : 0;
        ii[(y + 1) * (w + 1) + x + 1] = ii[y * (w + 1) + x + 1] + run;
      }
    }
    return ii;
  }

  function rectMean(ii, w, h, x0, y0, x1, y1) {
    x0 = Math.max(x0 | 0, 0); y0 = Math.max(y0 | 0, 0);
    x1 = Math.min(x1 | 0, w); y1 = Math.min(y1 | 0, h);
    if (x1 <= x0 || y1 <= y0) return 0;
    var W = w + 1;
    var s = ii[y1 * W + x1] - ii[y0 * W + x1] - ii[y1 * W + x0] + ii[y0 * W + x0];
    return s / ((x1 - x0) * (y1 - y0));
  }

  // --------------------------------------------------------- 連通元件（BFS）

  /** 回傳 {n, label, stats:[{x0,y0,x1,y1,area}]} */
  function components(bin, w, h) {
    var label = new Int32Array(w * h), stats = [], stack = [], cur = 0;
    for (var s = 0; s < w * h; s++) {
      if (!bin[s] || label[s]) continue;
      cur++;
      var x0 = w, x1 = -1, y0 = h, y1 = -1, area = 0;
      stack.length = 0; stack.push(s); label[s] = cur;
      while (stack.length) {
        var p = stack.pop(), px = p % w, py = (p / w) | 0;
        if (px < x0) x0 = px; if (px > x1) x1 = px;
        if (py < y0) y0 = py; if (py > y1) y1 = py;
        area++;
        for (var dy = -1; dy <= 1; dy++)
          for (var dx = -1; dx <= 1; dx++) {
            var nx = px + dx, ny = py + dy;
            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
            var q = ny * w + nx;
            if (bin[q] && !label[q]) { label[q] = cur; stack.push(q); }
          }
      }
      stats.push({ x0: x0, y0: y0, x1: x1, y1: y1, area: area, id: cur });
    }
    return { n: cur, label: label, stats: stats };
  }

  /** 只留下數字本體，去掉指示燈圓點、小數點這類小塊 */
  function keepDigitBlobs(bin, w, h) {
    var cc = components(bin, w, h);
    if (!cc.stats.length) return bin;
    var maxH = 0;
    cc.stats.forEach(function (s) { maxH = Math.max(maxH, s.y1 - s.y0 + 1); });
    var thr = 0.4 * maxH, out = new Uint8Array(w * h);
    cc.stats.forEach(function (s) {
      if (s.y1 - s.y0 + 1 >= thr && s.area >= 20)
        for (var i = 0; i < out.length; i++) if (cc.label[i] === s.id) out[i] = 1;
    });
    return out;
  }

  // ------------------------------------------------------ 找出畫面上的顯示器

  /**
   * 在紅色遮罩上找出「一排七段數字」的候選區域。
   * 先橫向投影切出列帶，再在列帶內縱向切開 —— 同一高度上可能並排兩台顯示器
   * （計時器與溫度），不切開就會被當成同一個。
   */
  function findDisplays(mask, w, h) {
    var bin = new Uint8Array(w * h);
    for (var i = 0; i < bin.length; i++) bin[i] = mask[i] > LIT ? 1 : 0;

    var rows = new Int32Array(h);
    for (var y = 0; y < h; y++) {
      var c = 0;
      for (var x = 0; x < w; x++) c += bin[y * w + x];
      rows[y] = c;
    }
    var bands = [], yy = 0;
    while (yy < h) {
      if (!rows[yy]) { yy++; continue; }
      var y1 = yy, gap = 0;
      while (y1 + 1 < h && gap <= 3) { y1++; gap = rows[y1] ? 0 : gap + 1; }
      y1 -= gap;
      if (y1 - yy + 1 >= 18 && y1 - yy + 1 <= 200) bands.push([yy, y1]);
      yy = y1 + 1;
    }

    var out = [];
    bands.forEach(function (bd) {
      var by0 = bd[0], by1 = bd[1], bh = by1 - by0 + 1;
      var sub = new Uint8Array(w * bh);
      for (var y = 0; y < bh; y++)
        for (var x = 0; x < w; x++) sub[y * w + x] = bin[(by0 + y) * w + x];
      var keep = keepDigitBlobs(sub, w, bh);
      var cols = new Int32Array(w);
      for (var x2 = 0; x2 < w; x2++) {
        var c2 = 0;
        for (var y2 = 0; y2 < bh; y2++) c2 += keep[y2 * w + x2];
        cols[x2] = c2;
      }
      var maxGap = (1.5 * bh) | 0, x3 = 0;
      while (x3 < w) {
        if (!cols[x3]) { x3++; continue; }
        var x4 = x3, g2 = 0;
        while (x4 + 1 < w && g2 <= maxGap) { x4++; g2 = cols[x4] ? 0 : g2 + 1; }
        x4 -= g2;
        var lit = 0;
        for (var x5 = x3; x5 <= x4; x5++) lit += cols[x5];
        if (x4 - x3 + 1 >= 1.2 * bh && lit >= 4 * bh)
          out.push({ x0: x3, y0: by0, x1: x4, y1: by1 });
        x3 = x4 + 1;
      }
    });
    return out;
  }

  // ----------------------------------------------------------- 模板比對追蹤

  /** ZNCC：與 OpenCV 的 TM_CCOEFF_NORMED 同一個定義 */
  function znccAt(img, iw, tpl, tw, th, ox, oy, tMean, tNorm) {
    var sum = 0, sum2 = 0, dot = 0, n = tw * th;
    for (var y = 0; y < th; y++) {
      var ir = (oy + y) * iw + ox, tr = y * tw;
      for (var x = 0; x < tw; x++) {
        var v = img[ir + x];
        sum += v; sum2 += v * v; dot += v * tpl[tr + x];
      }
    }
    var mean = sum / n;
    var num = dot - mean * tMean * n;
    var den = Math.sqrt(Math.max(sum2 - sum * sum / n, 1e-6)) * tNorm;
    return den > 0 ? num / den : -1;
  }

  function tplStats(tpl) {
    var sum = 0, sum2 = 0, n = tpl.length;
    for (var i = 0; i < n; i++) { sum += tpl[i]; sum2 += tpl[i] * tpl[i]; }
    var mean = sum / n;
    return { mean: mean, norm: Math.sqrt(Math.max(sum2 - sum * sum / n, 1e-6)) };
  }

  /** 在指定矩形範圍內搜尋最佳位置 */
  function searchBox(img, iw, ih, tpl, tw, th, x0, y0, x1, y1, step) {
    var st = tplStats(tpl), best = { score: -2, x: 0, y: 0 };
    x0 = Math.max(x0, 0); y0 = Math.max(y0, 0);
    x1 = Math.min(x1, iw - tw); y1 = Math.min(y1, ih - th);
    for (var y = y0; y <= y1; y += step)
      for (var x = x0; x <= x1; x += step) {
        var s = znccAt(img, iw, tpl, tw, th, x, y, st.mean, st.norm);
        if (s > best.score) { best.score = s; best.x = x; best.y = y; }
      }
    return best;
  }

  function downsample(img, w, h, f) {
    var dw = (w / f) | 0, dh = (h / f) | 0, out = new Uint8Array(dw * dh);
    for (var y = 0; y < dh; y++)
      for (var x = 0; x < dw; x++) out[y * dw + x] = img[(y * f) * w + x * f];
    return { data: out, w: dw, h: dh };
  }

  /**
   * 追蹤器：先在 1/4 解析度粗搜（快），再回到原解析度細修。
   * 這是能在手機上即時跑的關鍵 —— 全解析度全域搜尋會慢上兩個數量級。
   */
  function Tracker(refGray, w, h, tplBox, opts) {
    opts = opts || {};
    this.iw = w; this.ih = h;
    this.box = tplBox;
    this.radius = opts.radius || 90;
    this.f = opts.pyramid || 4;
    var tw = tplBox.x1 - tplBox.x0, th = tplBox.y1 - tplBox.y0;
    this.tw = tw; this.th = th;
    this.tpl = new Uint8Array(tw * th);
    for (var y = 0; y < th; y++)
      for (var x = 0; x < tw; x++)
        this.tpl[y * tw + x] = refGray[(tplBox.y0 + y) * w + tplBox.x0 + x];
    var d = downsample(this.tpl, tw, th, this.f);
    this.tplS = d.data; this.tsw = d.w; this.tsh = d.h;
    var d2 = downsample(this.tpl, tw, th, 2);   // 快速追蹤用的半尺寸模板
    this.tplH = d2.data; this.thw = d2.w; this.thh = d2.h;
    this.last = { x: tplBox.x0, y: tplBox.y0 };
  }

  /**
   * fast=true 時只在上一格位置附近做微幅搜尋。
   * 以原生張數擷取時，相鄰兩格之間位移只有 1~2 px，不需要每格都全域重找；
   * 全域搜尋每格要好幾毫秒，30fps 下會吃掉太多主執行緒時間。
   */
  Tracker.prototype.locate = function (gray, fast) {
    var f = this.f;
    if (fast && this.last) {
      var sm = downsample(gray, this.iw, this.ih, 2);
      var hx = Math.round(this.last.x / 2), hy = Math.round(this.last.y / 2);
      var coarse2 = searchBox(sm.data, sm.w, sm.h, this.tplH, this.thw, this.thh,
                              hx - 3, hy - 3, hx + 3, hy + 3, 1);
      if (coarse2.score >= 0.50) {
        var fine2 = searchBox(gray, this.iw, this.ih, this.tpl, this.tw, this.th,
                              coarse2.x * 2 - 2, coarse2.y * 2 - 2,
                              coarse2.x * 2 + 2, coarse2.y * 2 + 2, 1);
        if (fine2.score >= 0.45) {
          this.last = { x: fine2.x, y: fine2.y };
          return fine2;
        }
      }
    }
    var small = downsample(gray, this.iw, this.ih, f);
    var r = Math.ceil(this.radius / f);
    var cx = Math.round(this.last.x / f), cy = Math.round(this.last.y / f);
    var coarse = searchBox(small.data, small.w, small.h, this.tplS, this.tsw, this.tsh,
                           cx - r, cy - r, cx + r, cy + r, 1);
    var gx = coarse.x * f, gy = coarse.y * f;
    var fine = searchBox(gray, this.iw, this.ih, this.tpl, this.tw, this.th,
                         gx - f, gy - f, gx + f, gy + f, 1);
    this.last = { x: fine.x, y: fine.y };
    return { score: fine.score, x: fine.x, y: fine.y };
  };

  /** 依追蹤結果把 ROI 取樣回參考座標（固定大小，超出畫面補黑） */
  Tracker.prototype.warpRoi = function (rgba, roi, loc) {
    var w = this.iw, h = this.ih;
    var tx = loc.x + (roi.x - this.box.x0), ty = loc.y + (roi.y - this.box.y0);
    var out = new Uint8Array(roi.w * roi.h * 4);
    for (var v = 0; v < roi.h; v++) {
      var sy = ty + v;
      if (sy < 0 || sy >= h) continue;
      for (var u = 0; u < roi.w; u++) {
        var sx = tx + u;
        if (sx < 0 || sx >= w) continue;
        var si = (sy * w + sx) * 4, di = (v * roi.w + u) * 4;
        out[di] = rgba[si]; out[di + 1] = rgba[si + 1]; out[di + 2] = rgba[si + 2];
      }
    }
    return out;
  };

  /**
   * 在顯示器周圍挑追蹤模板。好的模板要「峰值高」且「峰值唯一」——
   * 面板上有兩台外觀相同的控制器，模板不夠獨特就會鎖錯台。
   */
  /** 搜尋並回傳最佳位置與「排除峰值鄰域後的次高分」，用來評估唯一性 */
  function searchWithSecond(img, iw, ih, tpl, tw, th, step, excl) {
    var st = tplStats(tpl), best = { score: -2, x: 0, y: 0 }, second = -2, scores = [];
    for (var y = 0; y <= ih - th; y += step)
      for (var x = 0; x <= iw - tw; x += step) {
        var sc = znccAt(img, iw, tpl, tw, th, x, y, st.mean, st.norm);
        scores.push([sc, x, y]);
        if (sc > best.score) { best.score = sc; best.x = x; best.y = y; }
      }
    for (var i = 0; i < scores.length; i++)
      if (Math.abs(scores[i][1] - best.x) > excl || Math.abs(scores[i][2] - best.y) > excl)
        if (scores[i][0] > second) second = scores[i][0];
    best.second = second;
    return best;
  }

  /**
   * 在顯示器周圍挑追蹤模板。好的模板要「峰值高」且「峰值唯一」——
   * 面板上有兩台外觀相同的控制器，模板不夠獨特就會鎖錯台。
   *
   * 全部在 1/4 解析度上比較（只是要選出哪一塊比較好追，不需要精度），
   * 選定後才在原解析度細修一次。全解析度暴搜五個候選要花好幾秒，
   * 在手機上會直接把主執行緒卡死。
   */
  function pickTemplate(refGray, laterGray, w, h, box) {
    var F = 4;
    var later = downsample(laterGray, w, h, F);
    var bw = box.x1 - box.x0 + 1, bh = box.y1 - box.y0 + 1;
    var cands = [
      [box.x0 - 0.2 * bw, box.y1 + 0.15 * bh, box.x1 + 0.2 * bw, box.y1 + 1.3 * bh],
      [box.x0 - 0.2 * bw, box.y0 - 1.3 * bh, box.x1 + 0.2 * bw, box.y0 - 0.15 * bh],
      [box.x0 - 0.2 * bw, box.y1 + 0.6 * bh, box.x1 + 0.2 * bw, box.y1 + 2.0 * bh],
      [box.x0 - 1.1 * bw, box.y0 - 0.3 * bh, box.x0 - 0.1 * bw, box.y1 + 0.3 * bh],
      [box.x1 + 0.1 * bw, box.y0 - 0.3 * bh, box.x1 + 1.1 * bw, box.y1 + 0.3 * bh]
    ];
    var best = null;
    cands.forEach(function (c) {
      var x0 = Math.max(c[0] | 0, 0), y0 = Math.max(c[1] | 0, 0);
      var x1 = Math.min(c[2] | 0, w - 1), y1 = Math.min(c[3] | 0, h - 1);
      var tw = x1 - x0, th = y1 - y0;
      if (tw < 60 || th < 30) return;
      var tpl = new Uint8Array(tw * th), sum = 0, sum2 = 0;
      for (var y = 0; y < th; y++)
        for (var x = 0; x < tw; x++) {
          var v = refGray[(y0 + y) * w + x0 + x];
          tpl[y * tw + x] = v; sum += v; sum2 += v * v;
        }
      var std = Math.sqrt(sum2 / (tw * th) - Math.pow(sum / (tw * th), 2));
      if (std < 12) return;                       // 一整片平坦，無法追蹤
      var ds = downsample(tpl, tw, th, F);
      if (ds.w < 8 || ds.h < 6) return;
      var hit = searchWithSecond(later.data, later.w, later.h, ds.data, ds.w, ds.h, 1, 6);
      if (Math.abs(hit.x * F - x0) + Math.abs(hit.y * F - y0) > 80) return;
      var score = hit.score + (hit.score - hit.second);
      if (!best || score > best.score)
        best = { score: score, peak: hit.score, unique: hit.score - hit.second,
                 box: { x0: x0, y0: y0, x1: x1, y1: y1 } };
    });
    return best;
  }

  // ------------------------------------------------------------------ 解碼

  /** 回傳 [字元, 判讀餘裕]；餘裕 = 最暗的亮段 - 最亮的暗段 */
  function decodeAt(ii, w, h, cx, cal) {
    var fills = [], on = [];

        // 圖片載入是非同步的，載好後補畫一次，否則第一次繪製時圖示還是空的
        img.onload = () => { try { roastChart.update(); } catch (e) { /* 圖表尚未建立 */ } };
        img.src = c.toDataURL();
        return img;
    }

    // 事件標記：CSV 第三欄的符號 -> 名稱與圖上樣式。要新增標記在這裡加一行即可。
    const MARK_TYPES = {
        '*': { name: '一爆', style: 'star',       radius: 10, color: '#ff3b30' },
        '#': { name: '下豆', style: beanIcon(22), radius: 12, color: '#6f4e37' }
    };
    const markData = [];      // 每個取樣點的標記字串，CSV 第三欄
    const sampleSecs = [];    // 每個取樣點的經過秒數，用來把標記對到最近的點
    let pendingMarks = [];    // 已按下但還沒歸到取樣點的標記

    // 同一點若有多個標記，取後定義的那個當代表形狀
    function markStyle(m) {
        if (m) {
            const keys = Object.keys(MARK_TYPES).filter(k => m.indexOf(k) >= 0);
            if (keys.length) return MARK_TYPES[keys[keys.length - 1]];
        }
        return null;
    }

    // 1. 初始化 Chart.js
    const ctx = document.getElementById('roastChart').getContext('2d');
    const roastChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: timeLabels,
            datasets: [{
                label: '豆溫曲線 (°C)',
                data: tempData,
                borderColor: '#ff9500',
                backgroundColor: 'rgba(255, 149, 0, 0.1)',
                borderWidth: 3,
                tension: 0.2,
                fill: true,
                // 有標記的點畫成紅色星星，其餘維持小圓點
                pointStyle: c => (markStyle(markData[c.dataIndex]) || {}).style || 'circle',
                pointRotation: c => (markStyle(markData[c.dataIndex]) || {}).rotation || 0,
                pointRadius: c => (markStyle(markData[c.dataIndex]) || {}).radius || 3,
                pointHoverRadius: c => ((markStyle(markData[c.dataIndex]) || {}).radius || 3) + 2,
                pointBorderWidth: c => markStyle(markData[c.dataIndex]) ? 3 : 1,
                pointBackgroundColor: c => (markStyle(markData[c.dataIndex]) || {}).color || '#ff9500',
                pointBorderColor: c => (markStyle(markData[c.dataIndex]) || {}).color || '#ff9500'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: {
                    callbacks: {
                        afterLabel: c => {
                            const m = markData[c.dataIndex];
                            if (!m) return undefined;
                            return Object.keys(MARK_TYPES)
                                .filter(k => m.indexOf(k) >= 0)
                                .map(k => MARK_TYPES[k].name).join('、');
                        }
                    }
                }
            },
            scales: {
                x: { title: { display: true, text: '時間 (分:秒)' } },
                y: { min: 20, max: 250, title: { display: true, text: '溫度 (°C)' } }
            }
        }
    });

    // 1.5 可手動調整的 ROI 紅框：拖曳移動、右下角把手縮放、雙擊重設
    //     位置以百分比記錄（相對於影像區域），並存入 localStorage 供下次使用
    const cameraWrapper = document.querySelector('.camera-wrapper');
    const ROI_STORAGE_KEY = 'probat-roi-config';
    const ROI_DEFAULTS = {
        'roi-temp': { left: 54, top: 60, width: 34, height: 10 }
    };

    function loadRoiConfig() {
        try {
            return JSON.parse(localStorage.getItem(ROI_STORAGE_KEY)) || {};
        } catch (e) {
            return {};
        }
    }
    // 只取仍存在的框，舊版存下來的 roi-time 設定直接忽略
    const stored = loadRoiConfig();
    const roiConfig = Object.assign({}, ROI_DEFAULTS);
    Object.keys(ROI_DEFAULTS).forEach(id => {
        if (stored[id]) roiConfig[id] = stored[id];
    });

    function saveRoiConfig() {
        localStorage.setItem(ROI_STORAGE_KEY, JSON.stringify(roiConfig));
    }

    function applyRoi(box) {
        const c = roiConfig[box.id];
        box.style.left = c.left + '%';
        box.style.top = c.top + '%';
        box.style.width = c.width + '%';
        box.style.height = c.height + '%';
    }

    // 將 ROI 百分比換算為 video 原始像素座標（供後續影像辨識擷取用）
    function getRoiPixelRect(id) {
        const c = roiConfig[id];
        return {
            x: Math.round(video.videoWidth * c.left / 100),
            y: Math.round(video.videoHeight * c.top / 100),
            width: Math.round(video.videoWidth * c.width / 100),
            height: Math.round(video.videoHeight * c.height / 100)
        };
    }

    function makeAdjustable(box) {
        applyRoi(box);
        const handle = box.querySelector('.roi-handle');
        let mode = null;
        let startX = 0, startY = 0, startRect = null;

        box.addEventListener('pointerdown', e => {
            mode = (e.target === handle) ? 'resize' : 'move';
            startX = e.clientX;
            startY = e.clientY;
            startRect = Object.assign({}, roiConfig[box.id]);
            try { box.setPointerCapture(e.pointerId); } catch (err) { /* 部分環境不支援 pointer capture */ }
            e.preventDefault();
        });

        box.addEventListener('pointermove', e => {
            if (!mode) return;
            const dx = (e.clientX - startX) / cameraWrapper.clientWidth * 100;
            const dy = (e.clientY - startY) / cameraWrapper.clientHeight * 100;
            const c = roiConfig[box.id];
            if (mode === 'move') {
                c.left = Math.min(Math.max(startRect.left + dx, 0), 100 - c.width);
                c.top = Math.min(Math.max(startRect.top + dy, 0), 100 - c.height);
            } else {
                c.width = Math.min(Math.max(startRect.width + dx, 8), 100 - c.left);
                c.height = Math.min(Math.max(startRect.height + dy, 4), 100 - c.top);
            }
            applyRoi(box);
        });

        function endDrag() {
            if (!mode) return;
            mode = null;
            saveRoiConfig();
        }
        box.addEventListener('pointerup', endDrag);
        box.addEventListener('pointercancel', endDrag);

        // 雙擊重設回預設位置
        box.addEventListener('dblclick', () => {
            roiConfig[box.id] = Object.assign({}, ROI_DEFAULTS[box.id]);
            applyRoi(box);
            saveRoiConfig();
        });
    }
    document.querySelectorAll('.roi-box').forEach(makeAdjustable);

    // 2. 影像來源管理：相機／影片檔 兩種模式，可隨時切換
    const srcCameraBtn = document.getElementById('src-camera');
    const srcFileBtn = document.getElementById('src-file');
    const videoFileInput = document.getElementById('video-file-input');
    let cameraStream = null;
    let fileObjectUrl = null;

    function setActiveSource(btn) {
        srcCameraBtn.classList.toggle('active', btn === srcCameraBtn);
        srcFileBtn.classList.toggle('active', btn === srcFileBtn);
    }

    // 切換來源時：釋放舊來源（關相機、回收物件 URL）並重置辨識狀態
    function stopCurrentSource() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        if (fileObjectUrl) {
            URL.revokeObjectURL(fileObjectUrl);
            fileObjectUrl = null;
        }
        video.srcObject = null;
        video.removeAttribute('src');
        hideExposureControl();
        resetRecognition();
    }

    function resetRecognition() {
        currentTemp = null;
        resetCore();                    // 清掉校準結果與影格緩衝，換來源後重新自動校準
        displayTemp.innerText = '--.- °C';
    }

    const srcMsg = document.getElementById('src-msg');
    function showSrcMsg(text) {
        srcMsg.innerText = text;
        srcMsg.style.display = text ? 'block' : 'none';
    }

    // 相機曝光控制：透過 applyConstraints 直接調整相機曝光。
    // Android Chrome 多數支援（exposureCompensation 或 exposureTime）；
    // iOS Safari 不開放此 API → 顯示提示並隱藏滑桿。
    const expCtl = document.getElementById('exposure-control');
    const expSlider = document.getElementById('exposure-slider');
    const expVal = document.getElementById('exposure-val');
    const expAutoBtn = document.getElementById('exposure-auto');
    const expNote = document.getElementById('exposure-note');
    let expTrack = null, expMode = null;

    function hideExposureControl() {
        expCtl.style.display = 'none';
        expNote.style.display = 'none';
        expTrack = null;
        expMode = null;
    }

    function setupExposureControl(stream) {
        const track = stream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== 'function') {
            expNote.style.display = 'block';
            return;
        }
        const caps = track.getCapabilities();
        const settings = typeof track.getSettings === 'function' ? track.getSettings() : {};
        expTrack = track;
        if (caps.exposureCompensation) {
            // EV 補償：維持自動測光，只偏移明暗（優先，較不易失控）
            expMode = 'ev';
            expSlider.min = caps.exposureCompensation.min;
            expSlider.max = caps.exposureCompensation.max;
            expSlider.step = caps.exposureCompensation.step || 0.1;
            expSlider.value = settings.exposureCompensation != null ? settings.exposureCompensation : 0;
            expVal.innerText = 'EV ' + Number(expSlider.value).toFixed(1);
            expCtl.style.display = 'flex';
        } else if (caps.exposureTime) {
            // 手動快門時間（單位 100µs）：對付 LED 掃描頻閃最直接
            expMode = 'time';
            expSlider.min = caps.exposureTime.min;
            expSlider.max = Math.min(caps.exposureTime.max, 2000); // 上限 0.2 秒避免整片過曝
            expSlider.step = caps.exposureTime.step || 1;
            expSlider.value = settings.exposureTime || expSlider.min;
            expVal.innerText = (expSlider.value / 10).toFixed(1) + 'ms';
            expCtl.style.display = 'flex';
        } else {
            expNote.style.display = 'block';
        }
    }

    expSlider.addEventListener('input', () => {
        if (!expTrack) return;
        const v = parseFloat(expSlider.value);
        let constraint;
        if (expMode === 'ev') {
            constraint = { exposureCompensation: v };
            expVal.innerText = 'EV ' + v.toFixed(1);
        } else {
            constraint = { exposureMode: 'manual', exposureTime: v };
            expVal.innerText = (v / 10).toFixed(1) + 'ms';
        }
        expTrack.applyConstraints({ advanced: [constraint] }).catch(err => {
            console.error('曝光設定失敗:', err);
            expVal.innerText = '不支援';
        });
    });

    expAutoBtn.addEventListener('click', () => {
        if (!expTrack) return;
        expTrack.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] })
            .then(() => {
                if (expMode === 'ev') {
                    const s = expTrack.getSettings();
                    expSlider.value = s.exposureCompensation != null ? s.exposureCompensation : 0;
                    expVal.innerText = 'EV ' + Number(expSlider.value).toFixed(1);
                } else {
                    expVal.innerText = '自動';
                }
            })
            .catch(() => {});
    });

    // 依錯誤類型給出可操作的修復指引
    function cameraErrorHelp(err) {
        const ua = navigator.userAgent;
        if (/Line\/|FBAN|FBAV|Instagram/i.test(ua)) {
            return '⚠️ 你正在 LINE／FB 等 App 的內建瀏覽器中，通常不支援相機。\n' +
                   '請點右上角選單，選「用 Safari／Chrome 開啟」後再試。';
        }
        if (err.name === 'NotAllowedError') {
            const isIOS = /iPhone|iPad/i.test(ua);
            return '⚠️ 相機權限被拒絕。開啟權限後重新整理頁面，再點「📷 相機」：\n' +
                   (isIOS
                     ? '① 網址列左側「AA」→ 網站設定 → 相機 → 允許\n② 或手機「設定」→ Safari → 相機 → 允許'
                     : '① 網址列的 🔒 鎖頭圖示 → 權限 → 相機 → 允許\n② 或手機「設定」→ 應用程式 → 瀏覽器 → 權限 → 相機');
        }
        if (err.name === 'NotFoundError' || err.name === 'NotSupportedError') {
            return '⚠️ 找不到可用的相機裝置，請改用「🎬 讀取影片檔」。';
        }
        if (err.name === 'NotReadableError') {
            return '⚠️ 相機正被其他 App 佔用，關閉其他使用相機的 App 後再點「📷 相機」。';
        }
        return `⚠️ 無法開啟相機（${err.name}），請改用「🎬 讀取影片檔」。`;
    }

    function useCamera() {
        stopCurrentSource();
        setActiveSource(srcCameraBtn);
        showSrcMsg('');
        if (!navigator.mediaDevices) {
            showSrcMsg('⚠️ 此環境無相機可用（需 HTTPS 網址），請改用「🎬 讀取影片檔」。');
            return;
        }
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        }).then(stream => {
            cameraStream = stream;
            video.srcObject = stream;
            setupExposureControl(stream);
        }).catch(() => {
            // 若環境不支援強行指定後鏡頭（如電腦測試），則彈性獲取
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(s => {
                    cameraStream = s;
                    video.srcObject = s;
                    setupExposureControl(s);
                })
                .catch(err => {
                    console.error('無法開啟相機:', err);
                    showSrcMsg(cameraErrorHelp(err));
                });
        });
    }

    function playVideoSrc(src) {
        video.src = src;
        video.muted = true;   // 靜音才允許自動播放
        video.loop = true;
        video.play().catch(err => console.error('影片播放失敗:', err));
    }

    function useVideoFile(file) {
        stopCurrentSource();
        setActiveSource(srcFileBtn);
        showSrcMsg('');
        fileObjectUrl = URL.createObjectURL(file);
        playVideoSrc(fileObjectUrl);
    }

    function useDemoVideo() {
        stopCurrentSource();
        setActiveSource(srcFileBtn);
        showSrcMsg('');
        playVideoSrc('video.mp4');
    }

    srcCameraBtn.addEventListener('click', useCamera);
    srcFileBtn.addEventListener('click', () => videoFileInput.click());
    videoFileInput.addEventListener('change', () => {
        if (videoFileInput.files.length) useVideoFile(videoFileInput.files[0]);
        videoFileInput.value = ''; // 允許重選同一檔案
    });

    // （初始來源選擇在腳本最尾端執行，確保所有辨識狀態變數已宣告）

    // 3. 影像處理與七段 LED 數字辨識（自動校準版）
    //
    //    與舊版最關鍵的差異：先對齊，再疊加。
    //    舊版註解寫「多幀疊加會因手持晃動糊化，不採用」——那在沒有對齊的前提下
    //    完全正確。但只要先用面板上不會變的區域做模板比對，把每一格對齊到同一
    //    座標之後再取最大值疊起來，就不會糊，而且能補滿 LED 掃描(multiplex)造成
    //    的缺筆劃。於是不必再丟棄不完整幀，也不必靠兩秒的多數決去重建讀值。
    //
    //    另外三件事改成開機時自動量測，不再寫死：
    //      · 顯示器位置與字格幾何（字距、字寬、位數）
    //      · 數字傾斜量（不扶正的話右下那一段 c 幾乎讀不到，整組解碼會失敗）
    //      · 亮度門檻
    //
    //    演算法與 led_temp.py 相同，已在三支不同拍攝角度的影片上逐點驗證。
    const debugCanvas = document.getElementById('debug-canvas');
    const debugCtx = debugCanvas.getContext('2d');
    const ocrRaw = document.getElementById('ocr-raw');
    const roiAutoEl = document.getElementById('roi-auto');

    const RING = 9;             // 對齊後保留的影格數；30fps 下約 0.3 秒
    const CALIB_FRAMES = 9;     // 自動校準前先累積幾格
    const RECAL_BAD_FRAMES = 90;// 追蹤連續失敗這麼多格就重新校準（約 3 秒）
    const CALIB_RETRY = 30;     // 校準失敗後至少隔幾格才重試（會退避加長）
    const DECIMALS = 1;         // PROBAT 顯示器固定一位小數

    let work = null;      // 工作區（video 像素座標）；只在這塊裡面運算，省效能
    let cal = null;       // 自動校準結果
    let tracker = null;
    let roiRef = null;    // LED 區域（工作區座標）
    let dispBox = null;   // 顯示器外框（工作區座標），畫綠框用
    let lastLoc = null;
    let boxKey = null;
    let badTicks = 0;
    let tick = 0;        // 解碼週期計數（100ms 一次），用於溫度連續性判斷
    let frames = 0;      // 擷取到的影格數
    let pumping = false;
    let mismatchStreak = 0;
    let firstReadTick = null;
    let lastAcceptTick = null;
    let calNextTry = 0;   // 下次允許嘗試校準的 tick
    let calFails = 0;
    let calWhy = '';      // 校準失敗原因，顯示在除錯列上
    const calBuf = [];    // 校準用的原始影格
    const ring = [];      // 對齊＋扶正後的遮罩環形緩衝

    function resetCore() {
        cal = null; tracker = null; roiRef = null; dispBox = null; lastLoc = null;
        calBuf.length = 0; ring.length = 0;
        badTicks = 0; mismatchStreak = 0;
        calNextTry = 0; calFails = 0; calWhy = '';
        firstReadTick = null; lastAcceptTick = null;
    }

    function drawDebugMask(mask, w, h) {
        debugCanvas.width = w;
        debugCanvas.height = h;
        const out = debugCtx.createImageData(w, h);
        for (let i = 0; i < w * h; i++) {
            out.data[i * 4] = mask[i] > window.LedCore.LIT ? 255 : 0;
            out.data[i * 4 + 3] = 255;
        }
        debugCtx.putImageData(out, 0, 0);
    }

    // 工作區＝使用者紅框往外放大。垂直方向留得多，因為追蹤模板通常是
    // 顯示器下方那排按鍵，必須落在工作區內才追得到。
    function workRect() {
        const r = getRoiPixelRect('roi-temp');
        const mx = r.width * 0.6, my = r.height * 1.2;
        const x = Math.max(Math.round(r.x - mx), 0);
        const y = Math.max(Math.round(r.y - my), 0);
        return {
            x: x, y: y,
            width: Math.min(Math.round(r.x + r.width + mx), video.videoWidth) - x,
            height: Math.min(Math.round(r.y + r.height + my), video.videoHeight) - y
        };
    }

    function tryCalibrate() {
        const C = window.LedCore;
        const w = work.width, h = work.height;
        const boxes = C.findDisplays(
            C.maxComposite(calBuf.map(f => C.redness(f, w, h))), w, h);
        if (!boxes.length) return '找不到顯示器';

        // 使用者的紅框就代表他要哪一台顯示器：挑中心離紅框中心最近的
        const r = getRoiPixelRect('roi-temp');
        const cx = r.x + r.width / 2 - work.x, cy = r.y + r.height / 2 - work.y;
        boxes.sort((a, b) => {
            const da = Math.hypot((a.x0 + a.x1) / 2 - cx, (a.y0 + a.y1) / 2 - cy);
            const db = Math.hypot((b.x0 + b.x1) / 2 - cx, (b.y0 + b.y1) / 2 - cy);
            return da - db;
        });
        const box = boxes[0];

        const refGray = C.grayscale(calBuf[calBuf.length - 1], w, h);
        const pick = C.pickTemplate(refGray, C.grayscale(calBuf[0], w, h), w, h, box);
        if (!pick) return '找不到可追蹤的面板特徵';

        const bh = box.y1 - box.y0 + 1;
        const rx = Math.max(Math.round(box.x0 - 1.5 * bh), 0);
        const ry = Math.max(Math.round(box.y0 - 0.3 * bh), 0);
        const roi = {
            x: rx, y: ry,
            w: Math.min(Math.round(box.x1 + 0.35 * bh), w) - rx,
            h: Math.min(Math.round(box.y1 + 0.3 * bh), h) - ry
        };
        if (roi.w < 30 || roi.h < 20) return '顯示器太小';

        const tr = new C.Tracker(refGray, w, h, pick.box, { radius: 60, pyramid: 4 });
        const masks = calBuf.map(f => C.redness(
            tr.warpRoi(f, roi, tr.locate(C.grayscale(f, w, h))), roi.w, roi.h));
        const comp = C.maxComposite(masks);
        const shear = C.estimateShear(comp, roi.w, roi.h);
        const flat = C.deskew(comp, roi.w, roi.h, shear);

        const c = { x0: 0, y0: 0, cellW: 0, cellH: 0, pitch: 0, nCells: 4,
                    segOn: 0.30, shear: shear, decimals: DECIMALS };
        if (C.fitGrid([flat], roi.w, roi.h, c) === null) return '字格對不上';
        C.tuneSegOn([flat], roi.w, roi.h, c);
        if (c.nCells < 2) return '位數不足';

        cal = c; tracker = tr; roiRef = roi; dispBox = box;
        return '';
    }

    // 綠色虛線框：顯示自動鎖定到的數字區域，並跟著追蹤結果移動
    function updateAutoRoiBox() {
        if (!cal || !lastLoc || !video.videoWidth) {
            roiAutoEl.style.display = 'none';
            return;
        }
        const dx = lastLoc.x - tracker.box.x0, dy = lastLoc.y - tracker.box.y0;
        roiAutoEl.style.display = 'block';
        roiAutoEl.style.left = ((work.x + dispBox.x0 + dx) / video.videoWidth * 100) + '%';
        roiAutoEl.style.top = ((work.y + dispBox.y0 + dy) / video.videoHeight * 100) + '%';
        roiAutoEl.style.width = ((dispBox.x1 - dispBox.x0) / video.videoWidth * 100) + '%';
        roiAutoEl.style.height = ((dispBox.y1 - dispBox.y0) / video.videoHeight * 100) + '%';
    }

    /**
     * 每一個影片影格都要跑：擷取 -> 追蹤 -> 對齊 -> 推入環形緩衝。
     *
     * ★ 必須以影片的原生張數擷取，不能每 100ms 抓一次。
     *   LED 是多工掃描的，每一格畫面只有一部分數字亮著；30fps 下疊 9 格只跨
     *   0.3 秒就能湊滿所有筆劃，而且期間讀值還沒變。若只用 10fps 取樣，不但
     *   要跨 0.9 秒（讀值早就變了），取樣週期還會和掃描頻率產生拍頻，
     *   造成某一位數被系統性漏掉 —— 實測會把 186.1 讀成 86.1、155.0 讀成 15.4。
     */
    function captureFrame() {
        if (!video.videoWidth || video.readyState < 2) return;
        const C = window.LedCore;

        const wr = workRect();
        const key = wr.x + ',' + wr.y + ',' + wr.width + ',' + wr.height;
        if (key !== boxKey) { boxKey = key; work = wr; resetCore(); }  // 紅框被拖動 → 重新校準
        if (work.width < 60 || work.height < 40) return;

        // 只把工作區畫進 canvas，不必搬整張畫面
        procCanvas.width = work.width;
        procCanvas.height = work.height;
        procCtx.drawImage(video, work.x, work.y, work.width, work.height,
                          0, 0, work.width, work.height);
        const img = procCtx.getImageData(0, 0, work.width, work.height).data;
        frames++;

        if (!cal) {
            // 校準是重運算（手機上約 1 秒），只能偶爾做一次。
            // 失敗就清掉緩衝重收一批，並拉長重試間隔——連續重試會把主執行緒卡死。
            calBuf.push(new Uint8Array(img));
            if (calBuf.length > CALIB_FRAMES) calBuf.shift();
            if (calBuf.length === CALIB_FRAMES && frames >= calNextTry) {
                calWhy = tryCalibrate();
                if (calWhy) {
                    calFails++;
                    calNextTry = frames + Math.min(CALIB_RETRY * calFails, 90);
                    calBuf.length = 0;
                }
            }
            if (cal) { calFails = 0; calBuf.length = 0; }
            return;
        }

        const loc = tracker.locate(C.grayscale(img, work.width, work.height), true);
        if (loc.score < 0.4) {                       // 追丟了（被遮住、離開畫面）
            if (++badTicks > RECAL_BAD_FRAMES) resetCore();
            return;
        }
        badTicks = 0;
        lastLoc = loc;

        const m = C.deskew(
            C.redness(tracker.warpRoi(img, roiRef, loc), roiRef.w, roiRef.h),
            roiRef.w, roiRef.h, cal.shear);
        ring.push(m);
        if (ring.length > RING) ring.shift();
    }

    // 以影片原生張數驅動擷取。requestVideoFrameCallback 每畫一格就回呼一次，
    // 且會帶正確的影格節奏；Firefox 尚未支援，退回 33ms 計時器。
    function startPump() {
        if (pumping) return;
        pumping = true;
        if (typeof video.requestVideoFrameCallback === 'function') {
            const step = () => {
                try { captureFrame(); } catch (err) { console.error('擷取失敗', err); resetCore(); }
                video.requestVideoFrameCallback(step);
            };
            video.requestVideoFrameCallback(step);
        } else {
            setInterval(() => {
                try { captureFrame(); } catch (err) { console.error('擷取失敗', err); resetCore(); }
            }, 33);                                  // Firefox 尚未支援 rVFC
        }
    }
    video.addEventListener('playing', startPump);
    video.addEventListener('loadeddata', startPump);

    // 物理連續性把關：豆溫不會瞬間跳動。允許變化幅度 = 2°C + 1.5°C/秒。
    // 舊版那一整套「缺百位修復、十倍位移防護、位數品質評分」是為了補救
    // 單幀缺字造成的殘缺讀值；改成全張數擷取＋對齊疊加之後不會再出現，故移除。
    function allowedDelta() {
        return 2 + 0.15 * (lastAcceptTick === null ? 0 : tick - lastAcceptTick);
    }

    function acceptTemp(v) {
        currentTemp = v;
        mismatchStreak = 0;
        lastAcceptTick = tick;
        displayTemp.innerText = v.toFixed(1) + ' °C';
    }

    function acceptReading(v) {
        if (!isFinite(v) || v < 0 || v > 400) return;
        if (currentTemp === null) {
            if (firstReadTick === null) firstReadTick = tick;
            acceptTemp(v);
        } else if (Math.abs(v - currentTemp) <= Math.min(allowedDelta(), 20)) {
            acceptTemp(v);
        } else if (++mismatchStreak >= 10) {
            acceptTemp(v);                            // 持續約 1 秒的偏離 → 重新鎖定
        }
    }

    // 解碼與畫面更新維持 100ms 一次即可 —— 擷取才需要全張數，解碼不用。
    setInterval(() => {
        const C = window.LedCore;
        updateAutoRoiBox();
        tick++;

        if (!cal) {
            ocrRaw.innerText = '位數組合：（自動校準中' + (calWhy ? '：' + calWhy : '…') + '）';
            return;
        }
        if (ring.length < 3) { ocrRaw.innerText = '位數組合：（累積影格中…）'; return; }

        try {
            drawDebugMask(C.maxComposite(ring), roiRef.w, roiRef.h);
            const res = C.readSample(ring, roiRef.w, roiRef.h, cal);
            const v = C.toValue(res.raw, cal.decimals);
            if (v !== null) {
                ocrRaw.innerText = '位數組合：' + res.raw.trim();
                acceptReading(v);
            } else {
                ocrRaw.innerText = '位數組合：（辨識中…）';
            }
        } catch (err) {
            console.error('辨識失敗', err);
            resetCore();
        }
    }, 100);


    // 4. 計時器與 1 秒取樣控制
    startBtn.addEventListener('click', () => {
        startTime = Date.now();
        timeLabels.length = 0;
        tempData.length = 0;
        markData.length = 0;
        sampleSecs.length = 0;
        pendingMarks = [];
        roastChart.update();

        startBtn.disabled = true;
        stopBtn.disabled = false;
        loadBtn.disabled = true;
        loadMsg.innerText = '';
        crackBtn.disabled = false;
        crackBtn.innerText = '★ 1爆';
        dropBtn.disabled = false;
        dropBtn.innerText = '☕ 下豆';

        roastTimer = setInterval(sampleTick, sampleSec * 1000);
    });

    // 每次取樣：記錄經過時間與當前辨識溫度
    function sampleTick() {
        const totalSeconds = Math.round((Date.now() - startTime) / 1000);

        // 格式化時間軸標籤為 分:秒
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        displayTime.innerText = timeStr;

        // 將當前辨識到的溫度塞入圖表（辨識不到時留空，圖表顯示斷點）
        timeLabels.push(timeStr);
        tempData.push(currentTemp === null ? null : parseFloat(currentTemp.toFixed(1)));
        sampleSecs.push(totalSeconds);
        markData.push('');

        // 按鈕通常按在兩次取樣之間：掛到時間上最接近的那個取樣點，
        // 這樣星星的位置才會貼近實際按下的瞬間，而不是一律往後延一格
        if (pendingMarks.length) {
            const cur = markData.length - 1, prev = cur - 1;
            pendingMarks.forEach(pm => {
                const nearPrev = prev >= 0 &&
                    Math.abs(pm.t - sampleSecs[prev]) < Math.abs(pm.t - totalSeconds);
                const i = nearPrev ? prev : cur;
                markData[i] = markData[i] ? markData[i] + pm.text : pm.text;
            });
            pendingMarks = [];
        }

        rescaleY();
        roastChart.update();
    }

    // Y 軸動態範圍：涵蓋 最小值-5 ～ 最大值+5
    function rescaleY() {
        const vals = tempData.filter(v => v !== null);
        if (vals.length) {
            roastChart.options.scales.y.min = Math.floor(Math.min(...vals)) - 5;
            roastChart.options.scales.y.max = Math.ceil(Math.max(...vals)) + 5;
        }
    }

    // 讀取先前匯出的 CSV，把曲線與標記還原到圖上（純檢視，不影響辨識）
    const loadBtn = document.getElementById('load-btn');
    const loadMsg = document.getElementById('load-msg');
    const csvInput = document.getElementById('csv-input');

    function parseCsv(text) {
        const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
        const rows = [];
        lines.forEach(line => {
            const c = line.split(',');
            const label = (c[0] || '').trim();
            if (!/^\d{1,3}:\d{2}$/.test(label)) return;      // 標題列或雜訊，跳過
            const t = parseFloat(c[1]);
            const mm = label.split(':');
            rows.push({
                label: label,
                temp: isFinite(t) ? t : null,
                mark: (c[2] || '').trim(),
                sec: parseInt(mm[0], 10) * 60 + parseInt(mm[1], 10)
            });
        });
        return rows;
    }

    loadBtn.addEventListener('click', () => csvInput.click());

    csvInput.addEventListener('change', () => {
        const file = csvInput.files && csvInput.files[0];
        csvInput.value = '';                                  // 允許連續讀同一個檔
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            let rows;
            try {
                rows = parseCsv(String(reader.result));
            } catch (err) {
                loadMsg.innerText = '讀取失敗：檔案格式不符';
                return;
            }
            if (!rows.length) {
                loadMsg.innerText = '讀取失敗：找不到「分:秒」格式的資料列';
                return;
            }
            timeLabels.length = 0; tempData.length = 0;
            markData.length = 0; sampleSecs.length = 0;
            rows.forEach(r => {
                timeLabels.push(r.label); tempData.push(r.temp);
                markData.push(r.mark); sampleSecs.push(r.sec);
            });
            rescaleY();
            roastChart.update();
            displayTime.innerText = rows[rows.length - 1].label;
            const marked = markData.filter(m => m).length;
            loadMsg.innerText = `已載入 ${file.name}：${rows.length} 筆`
                + (marked ? `、${marked} 個標記` : '');
        };
        reader.onerror = () => { loadMsg.innerText = '讀取失敗：無法開啟檔案'; };
        reader.readAsText(file, 'utf-8');
    });

    // 取樣間隔設定（1～10 秒，記憶於 localStorage；烘豆中調整立即生效）
    const sampleSlider = document.getElementById('sample-interval');
    const sampleValEl = document.getElementById('sample-interval-val');
    const SAMPLE_KEY = 'probat-sample-interval';
    let sampleSec = parseInt(localStorage.getItem(SAMPLE_KEY), 10);
    if (!(sampleSec >= 1 && sampleSec <= 10)) sampleSec = 1;

    function applySampleUi() {
        sampleValEl.innerText = `${sampleSec} 秒`;
        startBtn.innerText = `開始烘豆（${sampleSec}s取樣）`;
        sampleSlider.value = sampleSec;
    }
    applySampleUi();

    sampleSlider.addEventListener('input', () => {
        sampleSec = parseInt(sampleSlider.value, 10);
        localStorage.setItem(SAMPLE_KEY, String(sampleSec));
        applySampleUi();
        if (roastTimer) { // 烘豆進行中：以新間隔重啟計時器（時間軸以絕對經過時間計算，不受影響）
            clearInterval(roastTimer);
            roastTimer = setInterval(sampleTick, sampleSec * 1000);
        }
    });

    // 事件標記：記下按下的時刻，實際掛到哪個取樣點由 sampleTick 決定
    function markEvent(btn, symbol) {
        if (!roastTimer) return;
        pendingMarks.push({ t: (Date.now() - startTime) / 1000, text: symbol });
        btn.disabled = true;
        btn.innerText = btn.innerText + ' ✓';
    }
    crackBtn.addEventListener('click', () => markEvent(crackBtn, '*'));
    dropBtn.addEventListener('click', () => markEvent(dropBtn, '#'));

    // 停止是不可逆的動作，先跳確認框；按取消時計時器完全不動，繼續烘不會掉資料
    const confirmOverlay = document.getElementById('confirm-overlay');
    const confirmInfo = document.getElementById('confirm-info');

    function closeConfirm() { confirmOverlay.classList.remove('show'); }

    stopBtn.addEventListener('click', () => {
        if (!roastTimer) return;
        const marked = markData.filter(m => m).length;
        confirmInfo.innerText = `已烘焙 ${displayTime.innerText}，共 ${timeLabels.length} 筆紀錄`
            + (marked ? `、${marked} 個標記` : '');
        confirmOverlay.classList.add('show');
    });

    document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
    confirmOverlay.addEventListener('click', e => { if (e.target === confirmOverlay) closeConfirm(); });
    document.getElementById('confirm-ok').addEventListener('click', () => {
        closeConfirm();
        finishRoast();
    });

    function finishRoast() {
        clearInterval(roastTimer);
        roastTimer = null;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        crackBtn.disabled = true;
        dropBtn.disabled = true;
        loadBtn.disabled = false;

        // 按了標記但還沒輪到下一次取樣就停止，掛到最後一個點，避免遺失
        if (pendingMarks.length && markData.length) {
            const i = markData.length - 1;
            pendingMarks.forEach(pm => { markData[i] = markData[i] ? markData[i] + pm.text : pm.text; });
            pendingMarks = [];
            roastChart.update();
        }

        // 烘豆結束：自動生成 CSV 下載檔案
        let csvContent = "時間,溫度(°C),標記\n";
        timeLabels.forEach((label, index) => {
            csvContent += `${label},${tempData[index] === null ? '' : tempData[index]},${markData[index] || ''}\n`;
        });

        // 用 Blob 而不是 data: URI。data URI 會被標記符號 "#" 截斷
        // （encodeURI 不跳脫 "#"，之後的內容全被當成錨點丟掉），而且有長度上限，
        // 長時間烘豆的紀錄可能塞不下。開頭加 UTF-8 BOM，Excel 開中文標題才不會亂碼。
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        // 用「開爐時間」而不是匯出時間命名，同一天多爐才分得出來是哪一爐。
        // 注意要用當地時間：toISOString() 是 UTC，台灣清晨烘的豆會被標成前一天。
        const d = new Date(startTime);
        const pad = n => String(n).padStart(2, '0');
        const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
                    + `_${pad(d.getHours())}${pad(d.getMinutes())}`;
        link.download = `PROBAT_烘豆紀錄_${stamp}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        // 只用計時器延遲釋放，不要綁 pagehide／visibilitychange：
        // 手機上「切出瀏覽器去開這個檔案」就會讓頁面進背景並觸發那些事件，
        // 而瀏覽器下載 blob 是非同步的，此時提前 revoke 會得到空檔案。
        // 留久一點，代價只是幾十 KB 的記憶體，關掉分頁時系統本來就會回收。
        setTimeout(() => URL.revokeObjectURL(url), 300000);
    }

    // 初始來源：?source=mp4 載入示範影片，否則預設開相機
    if (new URLSearchParams(location.search).get('source') === 'mp4') {
        useDemoVideo();
    } else {
        useCamera();
    }
</script>
</body>
</html>
